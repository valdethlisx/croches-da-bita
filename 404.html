<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada · Crochês da Bita</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF6F0;color:#3E2A22;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  h1{font-family:Georgia,serif;font-weight:400;color:#591F0B;font-size:2rem;margin:0 0 10px}
  p{margin:0 0 22px}
  a{display:inline-block;padding:14px 26px;border-radius:999px;background:#DB3236;color:#fff;text-decoration:none;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
</style>
<script>
  // Links de peças (p/<slug>/ ou p/<slug>/<cor>/) que ainda não têm página gerada
  // são levados direto para a peça no catálogo.
  (function () {
    var m = location.pathname.match(/^(.*?\/)p\/([^\/]+)\/?(?:([^\/]+)\/?)?$/);
    if (m) location.replace(m[1] + '?bolsa=' + encodeURIComponent(m[2]) + (m[3] ? '&cor=' + encodeURIComponent(m[3]) : ''));
  })();
</script>
</head>
<body>
<main>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado. Veja todas as peças no catálogo.</p>
  <a id="voltar" href="/">Ver o catálogo</a>
</main>
<script>
  // No GitHub Pages o catálogo fica em /<repositório>/
  if (location.hostname.slice(-10) === 'github.io') {
    document.getElementById('voltar').href = '/' + location.pathname.split('/')[1] + '/';
  }
</script>
</body>
</html>
