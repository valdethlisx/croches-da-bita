# Publica o catálogo no GitHub Pages a cada alteração na branch main.
# Antes de publicar, gera as páginas de compartilhamento das peças (p/<slug>/),
# que mostram a foto e o nome da peça na prévia do link no WhatsApp e no Instagram.
name: Publicar catálogo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Gerar páginas de compartilhamento
        run: node tools/gerar-paginas.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
