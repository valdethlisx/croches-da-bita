<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bolsa Trança em 3D · Crochês da Bita</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --chocolate:#591F0B; --offwhite:#FAF6F0; --ink:#3E2A22; }
  html, body { margin:0; height:100%; background:var(--offwhite); color:var(--ink); font-family:"Jost", system-ui, sans-serif; overflow:hidden; }
  #cena { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .rotulo { position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom)); text-align:center; pointer-events:none; }
  .rotulo strong { display:block; font-family:"Cormorant Garamond", Georgia, serif; font-weight:500; font-size:1.5rem; color:var(--chocolate); }
  .rotulo span { font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; opacity:.7; }
  .carregando { position:fixed; inset:0; display:grid; place-items:center; font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--chocolate); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="carregando" id="carregando">Montando a bolsa…</div>
<canvas id="cena" aria-label="Modelo 3D ilustrativo da Bolsa Trança pink. Arraste para girar."></canvas>
<div class="rotulo"><strong>Bolsa Trança</strong><span>Ilustração 3D · arraste para girar</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Cena ----------
const canvas = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#FAF6F0');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(3.4, 2.6, 6.2);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4.2;
controls.maxDistance = 10;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
let retomar;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(retomar); });
controls.addEventListener('end', () => { retomar = setTimeout(() => { controls.autoRotate = true; }, 4000); });

scene.add(new THREE.HemisphereLight('#fff6ee', '#d9b8a8', 0.9));
const sol = new THREE.DirectionalLight('#fff3e6', 2.2);
sol.position.set(3, 6, 4);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
sol.shadow.camera.left = -3; sol.shadow.camera.right = 3; sol.shadow.camera.top = 4; sol.shadow.camera.bottom = -2;
sol.shadow.radius = 6;
sol.shadow.bias = -0.0005;
scene.add(sol);
const contraluz = new THREE.DirectionalLight('#ffd9e6', 0.8);
contraluz.position.set(-4, 3, -3);
scene.add(contraluz);

const chao = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.16 }));
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;
scene.add(chao);

// ---------- Texturas de crochê (geradas no navegador) ----------
const PINK = '#C2185B', PINK_ESCURO = '#6E0A33', PINK_CLARO = '#E2437F';

/** Ponto baixo em "V" do fio de malha: cor e relevo */
function texturaCroche() {
  const S = 512, cols = 8, rows = 8, cw = S / cols, rh = S / rows;
  const cor = document.createElement('canvas'); cor.width = cor.height = S;
  const rel = document.createElement('canvas'); rel.width = rel.height = S;
  const c = cor.getContext('2d'), r = rel.getContext('2d');
  c.fillStyle = PINK_ESCURO; c.fillRect(0, 0, S, S);
  r.fillStyle = '#000'; r.fillRect(0, 0, S, S);
  // Desenha um ponto "V" (duas laçadas inclinadas) com volume
  const ponto = (ctx, isRel, cx, cy) => {
    for (const lado of [-1, 1]) {
      ctx.save();
      ctx.translate(cx + lado * cw * 0.21, cy);
      ctx.rotate(lado * 0.48);
      const g = ctx.createRadialGradient(-lado * cw * 0.06, -rh * 0.2, 2, 0, 0, rh * 0.55);
      if (isRel) { g.addColorStop(0, '#fff'); g.addColorStop(0.65, '#8a8a8a'); g.addColorStop(1, '#000'); }
      else { g.addColorStop(0, PINK_CLARO); g.addColorStop(0.5, PINK); g.addColorStop(1, PINK_ESCURO); }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, cw * 0.25, rh * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  };
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const cx = x * cw + cw / 2 + (y % 2 ? cw / 2 : 0), cy = y * rh + rh / 2;
      for (const [ctx, isRel] of [[c, false], [r, true]]) {
        ponto(ctx, isRel, cx, cy);
        if (cx + cw / 2 > S) ponto(ctx, isRel, cx - S, cy); // repete na outra borda: textura sem emenda
      }
    }
  }
  const map = new THREE.CanvasTexture(cor); map.colorSpace = THREE.SRGBColorSpace;
  const bump = new THREE.CanvasTexture(rel);
  for (const t of [map, bump]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; }
  return { map, bump };
}

/** Listras finas do fio de malha, para a alça trançada e a borla */
function texturaFio() {
  const W = 64, H = 256;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, PINK_ESCURO); g.addColorStop(0.35, PINK); g.addColorStop(0.6, PINK_CLARO); g.addColorStop(1, PINK_ESCURO);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.globalAlpha = 0.18; c.fillStyle = '#000';
  for (let y = 0; y < H; y += 8) c.fillRect(0, y, W, 2);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const croche = texturaCroche();
// Pontos grossos do fio de malha: cerca de 40 pontos na volta e 14 carreiras de altura
const matCorpo = new THREE.MeshPhysicalMaterial({ map: croche.map, bumpMap: croche.bump, bumpScale: 9, roughness: 0.95, sheen: 0.35, sheenColor: new THREE.Color('#ff7aa8'), sheenRoughness: 0.8, envMapIntensity: 0.5 });
croche.map.repeat.set(5, 1.75); croche.bump.repeat.set(5, 1.75);
const matForro = new THREE.MeshStandardMaterial({ color: '#E3B32A', roughness: 0.75, side: THREE.BackSide });
const texFio = texturaFio();
const matFio = new THREE.MeshPhysicalMaterial({ map: texFio, roughness: 1, sheen: 0.3, sheenColor: new THREE.Color('#ff8fb6'), sheenRoughness: 0.9, envMapIntensity: 0.35 });
const matOuro = new THREE.MeshStandardMaterial({ color: '#D8B062', metalness: 1, roughness: 0.28 });

const bolsa = new THREE.Group();
scene.add(bolsa);

// ---------- Corpo: perfil girado e achatado (seção oval) ----------
const ALTURA = 1.55, PROF = 0.52;
const perfil = [
  [0.0, 0.0], [0.55, 0.0], [0.86, 0.02], [0.98, 0.09], [1.04, 0.25], [1.07, 0.55],
  [1.05, 0.9], [1.0, 1.2], [0.94, 1.42], [0.9, ALTURA],
].map(([r, y]) => new THREE.Vector2(r, y));
const corpo = new THREE.Mesh(new THREE.LatheGeometry(perfil, 96), matCorpo);
corpo.scale.set(1, 1, PROF);
corpo.castShadow = true;
bolsa.add(corpo);

const forroPerfil = perfil.map((v) => new THREE.Vector2(Math.max(0, v.x - 0.04), v.y));
const forro = new THREE.Mesh(new THREE.LatheGeometry(forroPerfil.slice(1), 96), matForro);
forro.scale.set(1, 1, PROF);
bolsa.add(forro);

// Borda da boca da bolsa
const borda = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.06, 18, 120), matCorpo);
borda.rotation.x = Math.PI / 2;
borda.scale.set(1, PROF, 1);
borda.position.y = ALTURA;
borda.castShadow = true;
bolsa.add(borda);

// ---------- Alça trançada: três fios girando em volta de um arco ----------
const arco = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.74, ALTURA - 0.08, 0),
  new THREE.Vector3(-0.9, 2.1, 0),
  new THREE.Vector3(-0.62, 2.78, 0),
  new THREE.Vector3(0, 3.0, 0),
  new THREE.Vector3(0.62, 2.78, 0),
  new THREE.Vector3(0.9, 2.1, 0),
  new THREE.Vector3(0.74, ALTURA - 0.08, 0),
]);
const AMOSTRAS = 400;
const quadros = arco.computeFrenetFrames(AMOSTRAS, false);

class Fio extends THREE.Curve {
  constructor(fase) { super(); this.fase = fase; }
  getPoint(t, alvo = new THREE.Vector3()) {
    const i = Math.min(AMOSTRAS, Math.round(t * AMOSTRAS));
    const p = arco.getPointAt(t);
    const n = quadros.normals[i], b = quadros.binormals[i];
    const ang = this.fase + t * Math.PI * 2 * 6.5;
    const raio = 0.085;
    return alvo.copy(p).addScaledVector(n, Math.cos(ang) * raio).addScaledVector(b, Math.sin(ang) * raio);
  }
}
for (let k = 0; k < 3; k++) {
  const fio = new THREE.Mesh(new THREE.TubeGeometry(new Fio((k * Math.PI * 2) / 3), 600, 0.098, 20, false), matFio);
  texFio.repeat.set(1, 60);
  fio.castShadow = true;
  bolsa.add(fio);
}

// ---------- Argolas douradas onde a alça encontra o corpo ----------
const pontosArgola = [new THREE.Vector3(-0.8, ALTURA - 0.02, 0.2), new THREE.Vector3(0.8, ALTURA - 0.02, 0.2)];
for (const p of pontosArgola) {
  const argola = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.018, 16, 48), matOuro);
  argola.position.copy(p);
  argola.rotation.y = Math.PI / 2;
  argola.castShadow = true;
  bolsa.add(argola);
}

// ---------- Corrente dourada pendurada na frente ----------
const curvaCorrente = new THREE.CatmullRomCurve3([
  pontosArgola[0].clone().add(new THREE.Vector3(0, -0.05, 0.02)),
  new THREE.Vector3(-0.85, 1.0, 0.58),
  new THREE.Vector3(-0.35, 0.62, 0.62),
  new THREE.Vector3(0.35, 0.62, 0.62),
  new THREE.Vector3(0.85, 1.0, 0.58),
  pontosArgola[1].clone().add(new THREE.Vector3(0, -0.05, 0.02)),
]);
const ELOS = 64;
const geoElo = new THREE.TorusGeometry(0.034, 0.009, 10, 24);
geoElo.scale(1.35, 1, 1);
for (let i = 0; i <= ELOS; i++) {
  const t = i / ELOS;
  const p = curvaCorrente.getPointAt(t);
  const tan = curvaCorrente.getTangentAt(t);
  const elo = new THREE.Mesh(geoElo, matOuro);
  elo.position.copy(p);
  elo.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), tan);
  elo.rotateX(i % 2 ? Math.PI / 2 : 0);
  elo.castShadow = true;
  bolsa.add(elo);
}

// ---------- Borla do mesmo fio, presa na argola da esquerda ----------
const borla = new THREE.Group();
borla.position.set(-0.86, ALTURA - 0.12, 0.42); // à frente da lateral esquerda, como na foto
const cabeca = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.16, 24), matFio);
cabeca.castShadow = true;
borla.add(cabeca);
const amarra = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.018, 10, 32), matFio);
amarra.rotation.x = Math.PI / 2; amarra.position.y = -0.1;
borla.add(amarra);
const geoTira = new THREE.BoxGeometry(0.04, 0.95, 0.012);
geoTira.translate(0, -0.475, 0);
for (let i = 0; i < 30; i++) {
  const a = (i / 30) * Math.PI * 2;
  const tira = new THREE.Mesh(geoTira, matFio);
  tira.position.set(Math.cos(a) * 0.07, -0.12, Math.sin(a) * 0.07);
  tira.rotation.y = -a;
  tira.rotation.z = Math.cos(a) * 0.12;
  tira.rotation.x = Math.sin(a) * 0.12;
  tira.scale.y = 0.85 + ((i * 37) % 10) / 50;
  tira.castShadow = true;
  borla.add(tira);
}
bolsa.add(borla);

// ---------- Render ----------
// Enquadra a bolsa inteira (com alça e borla) em qualquer formato de tela
const DIRECAO = new THREE.Vector3(3.4, 1.2, 6.2).normalize();
function ajustar() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const distAltura = (3.5 / 2) / tanV;                 // bolsa + alça ≈ 3,5 de altura
  const distLargura = (3.0 / 2) / (tanV * camera.aspect); // corpo + borla ≈ 3,0 de largura
  const dist = Math.max(distAltura, distLargura) * 1.08;
  controls.minDistance = dist * 0.6;
  controls.maxDistance = dist * 1.6;
  camera.position.copy(controls.target).addScaledVector(DIRECAO, dist);
  controls.update();
}
window.addEventListener('resize', ajustar);
ajustar();

document.getElementById('carregando').remove();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
